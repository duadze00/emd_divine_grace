<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS File -->
    <link rel="stylesheet" href="../CSS/functions.css" />

    <title>Addition Calculator</title>
  </head>
  <body>
    <!-- Main Calculator Container -->
    <div class="main">
      <!-- Number Inputs -->
      <div class="parent">
        <input type="number" id="left" placeholder="First Number" />

        <span>+</span>

        <input type="number" id="right" placeholder="Second Number" />
      </div>

      <!-- Result Display -->
      <input type="text" id="answer" placeholder="Result" readonly />

      <!-- Button -->
      <button id="add_btn">Add Numbers</button>
    </div>

    <!-- JavaScript File -->
    <script src="../JAVASCRIPT/functions.js"></script>
  </body>
</html>
