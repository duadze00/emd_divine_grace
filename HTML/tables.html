<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/CSS/tables.css" />
    <title>Document</title>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Eric</td>
          <td>25</td>
          <td>100</td>
        </tr>
        <tr>
          <td>Mawule</td>
          <td>24</td>
          <td>99</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>2</td>
          <td>2</td>
          <td>100</td>
        </tr>
      </tfoot>
    </table>

    <!-- Responsive Table -->
    <!-- A responsive table will display a horizontal scroll bar if the screen is too small to display the full content -->
    <div style="overflow-x: auto">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Eric</td>
            <td>25</td>
            <td>100</td>
          </tr>
          <tr>
            <td>Mawule</td>
            <td>24</td>
            <td>99</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
