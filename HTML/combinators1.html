<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/CSS/combinators1.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="descendant-selector-container">
      <p>First</p>
      <section>
        <p>Second</p>
      </section>
    </div>

    <div class="child-selector-container">
      <p>Direct child</p>
      <section>
        <p>Nested child</p>
      </section>
    </div>

    <h1 class="adjacent-sibling-selector">Title</h1>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>

    <h1 class="general-sibling-selector">Title</h1>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
    <p>Paragraph 3</p>
  </body>
</html>
