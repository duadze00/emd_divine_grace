<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object URL Real-World Demo</title>
    <style>
        /* CSS styling for a clean layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .preview-box {
            width: 150px;
            height: 150px;
            border: 3px dashed #cbd5e1;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8fafc;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Hidden until an image is loaded */
        }

        .placeholder-text {
            color: #94a3b8;
            font-size: 14px;
            padding: 10px;
        }

        input[type="file"] {
            display: none; /* Hide the ugly default input */
        }

        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .custom-file-upload:hover {
            background-color: #2563eb;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Profile Setup</h2>
        
        <div class="preview-box" id="previewBox">
            <span class="placeholder-text" id="placeholder">No Image Chosen</span>
            <img id="avatarPreview" src="" alt="Avatar Preview">
        </div>

        <label for="fileInput" class="custom-file-upload">
            Choose Photo
        </label>
        <input type="file" id="fileInput" accept="image/*">

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

        <p style="font-size: 13px; color: #64748b;">Bonus: Generate a text file on the fly & download it</p>
        <button class="download-btn" id="downloadBtn">Download Welcome Note</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const placeholder = document.getElementById('placeholder');
        
        // Track the current object URL so we can clean it up later
        let currentImageURL = null;

        // --- Use Case 1: Previewing a Local Image File ---
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];

            if (file) {
                // IMPORTANT CLEANUP: If there's an existing object URL, revoke it to prevent memory leaks
                if (currentImageURL) {
                    URL.revokeObjectURL(currentImageURL);
                }

                // Create a temporary local pointer/URL to the selected file
                currentImageURL = URL.createObjectURL(file);

                // Set the image source to this generated blob URL
                avatarPreview.src = currentImageURL;
                
                // Toggle UI elements visibility
                avatarPreview.style.display = 'block';
                placeholder.style.display = 'none';
            }
        });

        // --- Use Case 2: Generating a text file on-the-fly and forcing a download ---
        const downloadBtn = document.getElementById('downloadBtn');
        
        downloadBtn.addEventListener('click', function() {
            const textContent = "Thank you for trying out URL.createObjectURL()! This file was created entirely in your browser memory.";
            
            // 1. Wrap the string data in a standard modern Blob object
            const textBlob = new Blob([textContent], { type: 'text/plain' });
            
            // 2. Turn that Blob into a temporary download link
            const downloadURL = URL.createObjectURL(textBlob);
            
            // 3. Programmatically create an off-screen anchor link tag
            const tempLink = document.createElement('a');
            tempLink.href = downloadURL;
            tempLink.download = 'welcome-note.txt'; // Sets the default saved file name
            
            // 4. Trigger a virtual click to start the download browser prompt
            document.body.appendChild(tempLink);
            tempLink.click();
            
            // 5. Cleanup immediately after the link click event finishes
            document.body.removeChild(tempLink);
            URL.revokeObjectURL(downloadURL);
        });
    </script>
</body>
</html>
