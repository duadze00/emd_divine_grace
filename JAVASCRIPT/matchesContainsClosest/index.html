<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Event Delegation Mastery Playground</title>
    <style>
      :root {
        --bg-primary: #f8fafc;
        --surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #475569;
        --primary: #2563eb;
        --success: #16a34a;
        --danger: #dc2626;
        --accent: #7c3aed;
        --border: #e2e8f0;
        --code-bg: #1e293b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-main);
        line-height: 1.6;
        padding: 2rem 1rem;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 2.5rem;
        border-bottom: 2px solid var(--border);
        padding-bottom: 1.5rem;
      }
      h1 {
        font-size: 2.25rem;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      @media (min-width: 768px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .card h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .interactive-zone {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .demo-box {
        padding: 1rem;
        border: 2px dashed var(--border);
        border-radius: 8px;
        text-align: center;
      }
      .link-element {
        color: var(--primary);
        text-decoration: underline;
        cursor: pointer;
        font-weight: 500;
      }

      .btn {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .btn-normal {
        background-color: #f1f5f9;
        color: #334155;
        border-color: #cbd5e1;
      }
      .btn-danger {
        background-color: #fee2e2;
        color: var(--danger);
        border-color: #fca5a5;
      }

      .nested-component {
        background-color: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
      }
      .nested-inner {
        background-color: #ffffff;
        border: 1px solid var(--border);
        padding: 0.75rem;
        border-radius: 6px;
      }
      .deep-badge {
        background-color: #f3e8ff;
        color: var(--accent);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-weight: 700;
        cursor: pointer;
      }

      .logger-container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .logger-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .clear-btn {
        background: none;
        border: none;
        color: var(--primary);
        cursor: pointer;
        font-weight: 600;
      }

      .console-screen {
        background-color: var(--code-bg);
        color: #e2e8f0;
        font-family: monospace;
        font-size: 0.875rem;
        padding: 1rem;
        border-radius: 8px;
        flex-grow: 1;
        height: 320px;
        overflow-y: auto;
      }

      .log-line {
        margin-bottom: 0.5rem;
        border-left: 3px solid #64748b;
        padding-left: 0.5rem;
      }
      .log-success {
        border-color: #22c55e;
        color: #a7f3d0;
      }
      .log-warn {
        border-color: #eab308;
        color: #fef08a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>DOM Event Targets Mastery</h1>
        <p class="subtitle">Comprehensive runtime pipeline testing arena.</p>
      </header>

      <div class="grid">
        <div class="card">
          <h2>🕹️ Interactive Testing Arena</h2>
          <div class="interactive-zone" id="global-bubble-boundary">
            <div class="demo-box">
              <span>A basic string with a </span>
              <span class="link-element">.link-element target</span>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: center">
              <button class="btn btn-normal">Plain Button</button>
              <button class="btn btn-danger">Button.btn-danger</button>
            </div>
            <div class="nested-component" data-component-id="comp_991">
              <div class="nested-inner">
                <span class="deep-badge">Deep Nested Span Node</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="logger-container">
            <div class="logger-header">
              <h2>🖥️ Live Log Dashboard</h2>
              <button class="clear-btn" id="clear-console">Clear Screen</button>
            </div>
            <div class="console-screen" id="console-screen">
              <div class="log-line">
                // Click interactive elements on the left...
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
