<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="weather-card">
      <h1>Weather App</h1>

      <!-- Search -->
      <div class="search">
        <input type="text" id="cityInput" placeholder="Enter city..." />

        <button id="searchBtn">Search</button>
      </div>

      <!-- Error -->
      <p id="error"></p>

      <!-- Weather -->
      <div id="weather">
        <h2 id="city">Accra</h2>

        <img id="icon" src="" alt="Weather Icon" />

        <h1 id="temperature">29°C</h1>

        <h3 id="condition">Cloudy</h3>

        <div class="details">
          <div class="box">
            <h4>Humidity</h4>
            <p id="humidity">80%</p>
          </div>

          <div class="box">
            <h4>Wind</h4>
            <p id="wind">12 km/h</p>
          </div>

          <div class="box">
            <h4>Feels Like</h4>
            <p id="feels">31°C</p>
          </div>

          <div class="box">
            <h4>Pressure</h4>
            <p id="pressure">1012 hPa</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
