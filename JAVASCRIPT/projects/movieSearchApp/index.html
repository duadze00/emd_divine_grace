<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Movie Search App</title>
  </head>
  <body>
    <main>
      <div id="header">
        <h1>Movie Search</h1>
      </div>

      <div id="movie-input-container">
        <input type="text" id="movie-name" placeholder="Movie Name" />
        <button id="enter-btn">Enter</button>
      </div>
      <small id="invalid-input">No movie name was provided.</small>

      <div id="error-container">
        <h3 id="error">Error Occured: <span id="error-message"></span></h3>
      </div>

      <div id="movies">
        
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
