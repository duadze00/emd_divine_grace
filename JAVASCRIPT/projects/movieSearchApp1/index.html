<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch - Ultimate Movie Database</title>
    <!-- Linking external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section with Search Bar -->
    <header>
        <div class="header-container">
            <h1>CineSearch</h1>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search for a movie..." required>
                <button type="submit">Search</button>
            </form>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <!-- Loading Spinner Container (hidden by default via CSS) -->
        <div id="loading-spinner" class="spinner-container">
            <div class="spinner"></div>
            <p>Fetching movies...</p>
        </div>

        <!-- Movie Results Grid (Built with CSS Grid) -->
        <div id="movie-grid" class="movie-grid"></div>

        <!-- Error/Empty Message Container -->
        <div id="message-container" class="message-container"></div>

        <!-- Pagination Controls -->
        <div id="pagination" class="pagination-container hidden">
            <button id="prev-btn" disabled>Previous</button>
            <span id="page-num">Page 1</span>
            <button id="next-btn">Next</button>
        </div>
    </main>

    <!-- Movie Details Modal Structure -->
    <div id="movie-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <!-- Close Button -->
            <button id="close-modal-btn" class="close-btn">&times;</button>
            
            <!-- Dynamic Modal Content Area -->
            <div id="modal-body" class="modal-body">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Linking external JavaScript -->
    <script src="script.js"></script>
</body>
</html>
