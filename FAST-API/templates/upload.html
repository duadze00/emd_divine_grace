{% extends "base.html" %} {% block title %}Sell Product - ShopFast{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h2>List a New Product</h2>
    <form action="/products/upload" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="title">Product Name</label>
        <input
          type="text"
          id="title"
          name="title"
          class="form-control"
          required
          placeholder="e.g. Mechanical Keyboard"
        />
      </div>

      <div class="form-group">
        <label for="price">Price ($)</label>
        <input
          type="number"
          id="price"
          name="price"
          step="0.01"
          class="form-control"
          required
          placeholder="0.00"
        />
      </div>

      <div class="form-group">
        <label for="image">Product Image</label>
        <input
          type="file"
          id="image"
          name="image"
          class="form-control"
          accept="image/*"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Additional Info / Description</label>
        <textarea
          id="description"
          name="description"
          class="form-control"
          rows="5"
          placeholder="Describe your product condition..."
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; margin-top: 1rem"
      >
        Publish Listing
      </button>
    </form>
  </div>
</div>
{% endblock %}
