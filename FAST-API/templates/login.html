{% extends "base.html" %} {% block title %}Login - ShopFast{% endblock %} {%
block content %}
<div class="container">
  <div class="form-card">
    <h2>Login to Your Account</h2>
    <form action="/auth/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          required
          placeholder="Enter your username"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          required
          placeholder="Enter your password"
        />
      </div>
      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; margin-top: 1rem"
      >
        Sign In
      </button>
    </form>
    <p
      style="
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-muted);
      "
    >
      Don't have an account?
      <a href="/auth/register" style="color: var(--primary)">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
